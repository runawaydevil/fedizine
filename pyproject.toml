[project]
name = "fedizine"
version = "0.1.0"
description = "A tiny Fediverse press — monthly webzines and printable PDFs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "jinja2>=3.1.4",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "bleach>=6.2.0",
    "python-multipart>=0.0.17",
    "pillow>=11.0.0",
    "weasyprint>=63.0",
    "python-dotenv>=1.0.1",
    "typer>=0.15.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "itsdangerous>=2.2.0",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.2",
    "markdown>=3.7",
]

[project.scripts]
fedizine = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
